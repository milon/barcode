name: docs-site

# Deploys to https://milon.github.io/barcode/
# Public URL: https://oss.milon.im/barcode/ (Cloudflare Worker in milon/oss)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, gd, mbstring, zip, zlib
          coverage: none

      - name: Download Papyrus PHAR
        env:
          PAPYRUS_VERSION: "1.5.0"
        run: |
          curl -fsSL -o papyrus.phar \
            "https://github.com/milon/papyrus/releases/download/v${PAPYRUS_VERSION}/papyrus.phar"
          chmod +x papyrus.phar
          php papyrus.phar --version

      - name: Build documentation site
        env:
          PAPYRUS_BIN: php ${{ github.workspace }}/papyrus.phar
        run: |
          docs-src/bin/build-site
          test -f docs/milon-barcode-site/index.html
          grep -q 'base href="/barcode/"' docs/milon-barcode-site/index.html
          # cname in papyrus.yml is for absolute sitemap URLs only; do not claim the domain.
          rm -f docs/milon-barcode-site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/milon-barcode-site

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
